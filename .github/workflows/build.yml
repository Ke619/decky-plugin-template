name: Build Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-platform --omit=optional

      - name: Build
        run: npm run build

      - name: Copy plugin.json to dist
        run: cp plugin.json dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slsconfig-decky
          path: dist/
